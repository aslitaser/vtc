name: CI

on:
  push:
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: proofs
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Build the proof library
        working-directory: proofs
        run: |
          lake exe cache get Mathlib.Algebra.Order.Ring.Rat
          lake build
      - name: Check transitive axiom dependencies
        working-directory: proofs
        run: lake env lean CheckAxioms.lean
      - name: Exercise the strict graph decoder and evaluator
        working-directory: proofs
        timeout-minutes: 2
        run: lake env lean --run GraphEncodingTests.lean
